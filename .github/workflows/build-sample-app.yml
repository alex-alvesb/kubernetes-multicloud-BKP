name: Build and Deploy Sample App

on:
  push:
    branches: [main]
    paths:
      - 'sample-app/Dockerfile'
      - 'sample-app/index.html'
      - '.github/workflows/build-sample-app.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

jobs:
  deploy-aws:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: us-east-1
      ECR_REPOSITORY: 679346886253.dkr.ecr.us-east-1.amazonaws.com/kubernetes-multicloud-sample-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::679346886253:role/kubernetes-multicloud-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} sample-app/
          docker push $ECR_REPOSITORY:${{ github.sha }}

      - name: Update image tag in manifest
        run: sed -i "s|image: .*|image: $ECR_REPOSITORY:${{ github.sha }}|" aws-eks/k8s/sample-app/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add aws-eks/k8s/sample-app/deployment.yaml
          git commit -m "Deploy sample-app (AWS): ${{ github.sha }} [skip ci]"
          git push

  deploy-azure:
    runs-on: ubuntu-latest
    env:
      ACR_REPOSITORY: acrkubmulticloud4dc010b6.azurecr.io/kubernetes-multicloud-sample-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: 29df9fdf-1421-44b3-aeed-e8885ee59547
          tenant-id: 06094a4e-520a-4f9b-8d49-7a81ea37c2e3
          subscription-id: 4dc010b6-26c3-427d-80a3-af1df4fccd6c

      - name: Login to ACR
        run: az acr login --name acrkubmulticloud4dc010b6

      - name: Build and push to ACR
        run: |
          docker build -t $ACR_REPOSITORY:${{ github.sha }} sample-app/
          docker push $ACR_REPOSITORY:${{ github.sha }}

      - name: Update image tag in manifest
        run: sed -i "s|image: .*|image: $ACR_REPOSITORY:${{ github.sha }}|" azure-aks/k8s/sample-app/deployment.yaml

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add azure-aks/k8s/sample-app/deployment.yaml
          git commit -m "Deploy sample-app (Azure): ${{ github.sha }} [skip ci]"
          git push