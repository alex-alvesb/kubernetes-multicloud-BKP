name: Build and Deploy Sample App

on:
  push:
    branches: [main]
    paths:
      - 'sample-app/Dockerfile'
      - 'sample-app/index.html'
      - '.github/workflows/build-sample-app.yml'
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: 679346886253.dkr.ecr.us-east-1.amazonaws.com/kubernetes-multicloud-sample-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::679346886253:role/kubernetes-multicloud-github-actions
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        run: |
          docker build -t $ECR_REPOSITORY:${{ github.sha }} sample-app/
          docker push $ECR_REPOSITORY:${{ github.sha }}

      - name: Update image tag in manifest
        run: |
          sed -i "s|image: .*|image: $ECR_REPOSITORY:${{ github.sha }}|" sample-app/k8s/deployment.yaml

      - name: Commit and push updated manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sample-app/k8s/deployment.yaml
          git commit -m "Deploy sample-app: ${{ github.sha }} [skip ci]"
          git push