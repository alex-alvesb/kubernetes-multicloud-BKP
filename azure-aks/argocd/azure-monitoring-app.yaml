apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: azure-monitoring-ingress
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alex-alvesb/kubernetes-multicloud-BKP.git
    targetRevision: main
    path: azure-aks/k8s/monitoring
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true