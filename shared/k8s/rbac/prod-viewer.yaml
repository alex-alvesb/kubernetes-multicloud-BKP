apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prod-viewer
  namespace: prod
rules:
  - apiGroups: ["", "apps"]
    resources: ["pods", "deployments", "replicasets", "services", "configmaps", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prod-viewer-binding
  namespace: prod
subjects:
  - kind: Group
    name: prod-viewers
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: prod-viewer
  apiGroup: rbac.authorization.k8s.io