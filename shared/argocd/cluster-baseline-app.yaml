apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-baseline
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/alex-alvesb/kubernetes-multicloud.git
    targetRevision: main
    path: shared/k8s
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true